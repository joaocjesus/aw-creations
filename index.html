<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Visual and marketing storytelling that helps small businesses tell better stories through short-form video and marketing." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anna Wilson Creations — Visual and Marketing Storytelling" />
    <meta property="og:description" content="Helping small businesses tell better stories through short-form video and marketing." />
    <meta property="og:image" content="/media/portrait-bokah-flowers.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html {
        background: #f5f1e8;
        color: #1a1814;
      }

      html.dark {
        background: #1a1814;
        color: #f5f1e8;
      }

      body,
      #root {
        min-height: 100%;
        background: inherit;
        color: inherit;
      }

      body {
        margin: 0;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('anna-web-theme');
          var dark =
            !theme ||
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/fonts/fraunces-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet" />
    <title>Anna Wilson Creations — Visual and Marketing Storytelling</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
